[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burstserve"
version = "0.1.0"
description = "Deadline-aware virtual-service scheduling for malleable diffusion workloads"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
burstserve-run-asle = "burstserve.asle_runner:main"
burstserve-capture-environment = "burstserve.environment:main"
burstserve-vendor-asle = "burstserve.vendor_import:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
